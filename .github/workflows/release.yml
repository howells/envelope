# The only GitHub Actions workflow in this repository, and the only thing it does
# is publish to npm. Checks run locally; nothing here runs on push, on pull
# request, or on a schedule.
#
# It exists because npm will not let a package be published unattended from a
# developer machine. Trusted publishing (OIDC) is the one path that needs no
# token and no one-time code, and it only works from a hosted CI runner.
#
# Renaming this file breaks publishing: npm's trusted publisher configuration
# names the workflow by filename.
name: Publish

# A version tag is what ships a release. The tag stays in the repo as the record
# of what went out, and the job refuses to run when the tag and the package.json
# version disagree, so a mistyped tag stops rather than publishes.
# workflow_dispatch is kept for the dry run and for re-running a failed publish
# without cutting a second tag.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack the tarball, but do not publish
        type: boolean
        default: false

# id-token is what npm exchanges for publish rights. Nothing here writes to the
# repository.
permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A tag push carries the version in the tag itself; a manual run takes it
      # from the manifest. Both end at the same outputs, so every step below is
      # trigger-agnostic.
      - name: Resolve the release target
        id: version
        run: |
          set -euo pipefail
          manifest=package.json
          name=$(node -p "require('./$manifest').name")
          version=$(node -p "require('./$manifest').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tagged="${GITHUB_REF_NAME#v}"
            # The tag is a claim about what is being shipped; the manifest is
            # what actually ships. A mistyped tag stops here instead of
            # publishing a version nobody asked for.
            if [ "$tagged" != "$version" ]; then
              echo "::error::tag says $tagged but $manifest says $version"
              exit 1
            fi
          fi
          {
            echo "manifest=$manifest"
            echo "name=$name"
            echo "version=$version"
            echo "slug=howells-envelope"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $name@$version from $GITHUB_SHA"
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/release-artifacts"
      # Publishing the packed tarball, never the working directory. No --access
      # flag; publishConfig decides, and npm access is package-level rather than
      # version-level.
      #
      # --provenance is passed explicitly. npm documents trusted publishing as
      # attaching provenance by itself; measured as a controlled pair on
      # @howells/lint, the flag is what actually attaches it.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          npm publish "$(ls "$GITHUB_WORKSPACE"/release-artifacts/*.tgz)" --provenance

      - name: Keep the release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.slug }}-${{ steps.version.outputs.version }}
          path: release-artifacts/
          retention-days: 90
          if-no-files-found: error
